services:
  noveltrax:
    # Option A: Build directly from GitHub repo without manual git clone on TrueNAS
    build:
      context: https://github.com/Wemew/NovelTrax.git#main
      dockerfile: Dockerfile

    # Option B (Alternative): If you git cloned the repository locally on your server:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    image: noveltrax:latest
    container_name: noveltrax
    restart: unless-stopped

    # TrueNAS SCALE unprivileged 'apps' user and group
    user: "568:568"

    # Container security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      # Default binds loopback: the API has no authentication (SEC-07). Keep the port
      # on 127.0.0.1 and front it with an authenticating reverse proxy, or opt in to
      # LAN exposure explicitly: NOVELTRAX_BIND=0.0.0.0 (TrueNAS: set the same value
      # in the app's environment variables).
      # Format: "${NOVELTRAX_BIND:-127.0.0.1}:HOST_PORT:CONTAINER_PORT"
      # If 8080 is used by another service, change the middle number (e.g. 8282:8080).
      - "${NOVELTRAX_BIND:-127.0.0.1}:8080:8080"

    environment:
      - PORT=8080
      - CALIBRE_DIR=/calibre
      - DATA_DIR=/app/data
      - TZ=Etc/UTC  # Set to your timezone, e.g. Europe/Copenhagen, America/New_York
      # Local folder where the TorBox debrid engine fetches finished novel files.
      - DOWNLOAD_DIR=/downloads
      # Optional: seed the TorBox engine on first start.
      # - TORBOX_API_KEY=your-torbox-api-key
      # - TORBOX_ENABLED=true

    volumes:
      # 1. Mount your Calibre library dataset or folder (READ-ONLY)
      # Replace '/mnt/pool/media/calibre' with your actual TrueNAS dataset path:
      - /mnt/tank/media/calibre:/calibre:ro

      # 2. Mount persistent storage for NovelTrax database, cached covers, and logs
      # Replace '/mnt/pool/apps/noveltrax/data' with your app dataset:
      - /mnt/tank/apps/noveltrax/data:/app/data

      # 3. TorBox download target. This is where fetched novel files are written;
      # it must be writable by the container's UID/GID (568:568 on TrueNAS SCALE).
      - /mnt/tank/apps/noveltrax/downloads:/downloads
